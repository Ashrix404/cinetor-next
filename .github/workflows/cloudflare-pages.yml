name: cloudflare-pages
# Temporary live web app on Cloudflare Pages (user request 2026-11-20). Needs the repo secrets
# CLOUDFLARE_API_TOKEN (permission: Account › Cloudflare Pages › Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: chk
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: '[ -n "$T" ] && [ -n "$A" ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "::notice::Cloudflare secrets not set, skipping"'
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - if: steps.chk.outputs.ok == 'true'
        run: npm ci && npm run build:web
        env:
          VITE_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          VITE_APP_VERSION: 0.0.0-cf.${{ github.run_number }}
      - if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create cinetor --production-branch main
      - if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name cinetor --branch main --commit-dirty=true
