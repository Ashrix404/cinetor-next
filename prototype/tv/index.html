<style>
/* Cinetor Android TV preview. Self-contained: delete this folder (tv/) to remove it. */
:root{color-scheme:dark;--bg:#000;--c:#141416;--c2:#1f1f23;--on:#f5f0ef;--dim:#a8a2a1;--p:#fff;--onp:#111;--line:#34343a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050505;color:var(--on);font-family:Roboto,system-ui,sans-serif;overflow:hidden}
#tv{position:absolute;left:50%;top:50%;width:1280px;height:720px;background:var(--bg);overflow:hidden;transform-origin:0 0}

[data-f]{outline:none}

.nv.f{background:#fff;color:#111;outline:none}.nv.f i{color:#111}

.btns{display:flex;gap:14px}.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 28px;border-radius:999px;background:#2a2a2e;font-size:18px;font-weight:600;cursor:pointer}.btn.p{background:#fff;color:#111}
.btn.f{background:#fff;color:#111}

.pt span{position:absolute;left:10px;right:10px;bottom:9px;font-size:14px;font-weight:600;line-height:1.15;text-shadow:0 1px 6px #000}
.pt::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 50%)}.pt span,.pt .r{z-index:2}
.pt .r{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);padding:1px 7px;border-radius:7px;font-size:12px;font-weight:700}.pt .r i{color:#ffc933;font-size:12px}
.pt.w{width:260px;height:146px}.pt .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);z-index:3}.pt .bar b{display:block;height:100%;background:#fff}

.set{margin:0 48px 12px;width:640px;display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:14px;background:var(--c);font-size:19px;cursor:pointer}.set i{font-size:26px;color:var(--dim)}.set small{display:block;color:var(--dim);font-size:14px}.set .g{flex:1}
.swt{width:56px;height:30px;border-radius:15px;background:var(--c2);border:2px solid var(--dim);position:relative}.swt::after{content:"";position:absolute;top:4px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--dim)}.swt.on{background:#fff;border-color:#fff}.swt.on::after{left:29px;top:3px;width:20px;height:20px;background:#111}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:12px;justify-content:center;margin-top:18px}.pad .k{height:62px;border-radius:14px;background:var(--c2);display:grid;place-items:center;font-size:26px;font-weight:600;cursor:pointer}
.pc{text-align:center;padding-top:80px}.pc h2{font-size:34px;margin:10px 0}.dots{display:flex;gap:16px;justify-content:center;margin:14px 0}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--dim)}.dots i.on{background:#fff;border-color:#fff}
.dtl{display:flex;gap:40px;padding:0 48px}.cast{display:flex;gap:18px;padding:8px 48px 14px;overflow-x:auto;scrollbar-width:none}.cast .c{flex:none;width:96px;text-align:center;font-size:13px;cursor:pointer}.cast u{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--c2) center/cover;text-decoration:none;font-size:26px;font-weight:700}
.ep{display:flex;gap:16px;align-items:center;margin:0 48px 10px;padding:10px;border-radius:12px;background:var(--c);width:720px;cursor:pointer}.ep .th{width:160px;height:90px;border-radius:8px;background:linear-gradient(150deg,hsl(var(--h) 50% 34%),#111);position:relative;overflow:hidden;flex:none}.ep b{font-size:18px}.ep small{display:block;color:var(--dim)}
/* player */
#player{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,hsl(var(--h) 40% 24%),#030304 72%)}
#player .ui{position:absolute;inset:0;}#player.hide .ui{visibility:hidden}
.ptop{position:absolute;left:40px;right:40px;top:28px;display:flex;gap:12px;align-items:center}.ptop .g{flex:1;font-size:24px;font-weight:600}
.pb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:24px;cursor:pointer}.pb.f{background:#fff;color:#111}
.pmid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:44px}.pmid .pb{width:76px;height:76px;font-size:38px}.pmid .big{width:100px;height:100px;font-size:54px;background:#fff;color:#111}
.pbot{position:absolute;left:40px;right:40px;bottom:30px}.pbot .row2{display:flex;gap:10px;margin-bottom:14px}
.seek{height:8px;border-radius:4px;background:rgba(255,255,255,.25);position:relative;cursor:pointer}.seek b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#fff}.seek.f{box-shadow:0 0 0 3px #fff}
.tm{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);margin-top:8px}
.menu{position:absolute;right:30px;bottom:110px;width:320px;max-height:420px;overflow:auto;background:#1b1b1f;border-radius:16px;padding:10px;z-index:60}.menu div{padding:13px 16px;border-radius:10px;font-size:18px;display:flex;justify-content:space-between;cursor:pointer}.menu div.f{background:#fff;color:#111;transform:none;box-shadow:none}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#e9e5e4;color:#111;padding:12px 22px;border-radius:12px;font-size:17px;z-index:99}
#splash{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1c1c20,#050506 70%);transition:opacity .6s}#splash.out{opacity:0}
#splash div{text-align:center}#splash svg{width:120px;fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round}#splash h1{font-weight:300;letter-spacing:.3em;font-size:36px;margin:20px 0 0;padding-left:.3em}#splash h1 b{font-weight:800}#splash small{color:#6f6a6a;letter-spacing:.16em;display:block;margin-top:50px;font-size:13px}

.pt.see{display:grid;place-items:center;text-align:center;background:var(--c2);font-size:40px}.pt.see b{font-size:16px;font-weight:600;display:block;margin-top:4px}.pt.see::after{display:none}.ch.see{font-size:34px;color:var(--dim)}.ch.see b{font-size:16px}
.ch{position:relative}
.spr{display:flex;gap:22px;padding:14px 48px 8px}.spc{flex:none;width:92px;text-align:center;cursor:pointer}.spc .ring{position:relative;display:grid;place-items:center;width:84px;height:84px;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:var(--c);font-size:36px}.spc.on .ring{border-color:#fff}.spc small{display:block;margin-top:8px;font-size:16px}.spc.f .ring{background:#fff;color:#111}
.bdg{position:absolute;top:-4px;right:-4px;min-width:26px;height:26px;border-radius:50%;background:#fff;color:#111;font-size:14px;font-weight:800;display:grid;place-items:center}
.sts{display:flex;gap:12px;padding:8px 48px}.sts span{height:46px;padding:0 24px;border-radius:14px;border:2px solid var(--line);background:var(--c);display:inline-flex;align-items:center;font-size:18px;font-weight:600;cursor:pointer}.sts span.on{border-color:#fff}.sts span.f{background:#fff;color:#111}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:12px 48px 40px}
.mcd{border:2px solid var(--line);border-radius:16px;background:var(--c);padding:14px 18px;cursor:pointer}.mh{display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:600;color:var(--dim)}.mr{display:flex;gap:8px;align-items:center;white-space:nowrap;color:var(--dim)}.tmc{color:#fff;font-weight:700}
.mbd{display:grid;grid-template-columns:56px 1fr auto 1fr 56px;gap:10px;align-items:center;padding-top:12px}.tn{font-size:20px;font-weight:600;line-height:1.1}.mbd .tn:nth-of-type(1){text-align:right}.vs{font-size:22px}
.cr{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}.cr.tc{background:var(--c2)}
.row h3{display:flex;justify-content:space-between;align-items:center;padding-right:48px}.seeb{display:inline-flex;align-items:center;gap:4px;font-size:17px;font-weight:500;color:var(--dim);padding:6px 16px;border-radius:999px;cursor:pointer}.seeb.f{background:#fff;color:#111;transform:none;box-shadow:none}
.backbar{padding:18px 48px 0}.backbar .btn{height:44px;font-size:17px}
</style></head><body>
<div id="tv"><div id="side"></div><div id="main"></div></div>
<script>
const SVGMARK='<svg viewBox="0 0 24 24"><path d="M17.3 7.7a6.9 6.9 0 1 0 0 8.6" stroke-width="2.4"/><path d="M11.4 9.6l4.2 2.4-4.2 2.4z" fill="#fff" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/></svg>';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/"/g,'&quot;'),I=n=>`<i class="mdi mdi-${n}"></i>`;
const hs=t=>[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
/* ---- scale 1280x720 to the window ---- */
function fit(){const t=$('#tv'),k=Math.min(innerWidth/1280,innerHeight/720);t.style.transform=`scale(${k}) translate(-50%,-50%)`;t.style.left='50%';t.style.top='50%'}
addEventListener('resize',fit);fit();
/* ---- data (placeholders, replaced by TMDB when ../config.js has a token) ---- */
const W1=['Silent','Crimson','Hollow','Golden','Midnight','Iron','Glass','Paper','Salt','Ember','Velvet','Northern'],W2=['Harbor','Orchard','Gate','Ledger','Court','Tide','Lantern','Station','Meridian','Garden'];
const gen=(sd,n)=>Array.from({length:n},(_,i)=>{const t=W1[(i+sd)%12]+' '+W2[(i*3+sd)%10];return [t,hs(t)%360]});
const REAL={};let TMKEY=window.CINETOR_TMDB||'';
const L={home:gen(0,24),anime:gen(3,18),'K-Drama':gen(5,16),'C-Drama':gen(7,16),'J-Drama':gen(9,16),'Pakistani Drama':gen(11,16),adult:gen(6,14),music:gen(8,12)};
const GEN=['Action','Adventure','Comedy','Crime','Drama','Family','Fantasy','Horror','Mystery','Romance','Sci-Fi','Thriller'];
const CHN=['News 24','Cinema One','Kids Zone','Nature HD','Music Hub','Drama Plus','Sport Arena','Comedy Club'];
const MATCH=[['Cricket','Asia Cup Rising Stars','Pakistan A','UAE'],['Cricket','ICC World Test Championship','Pakistan','Sri Lanka'],['Basketball','NBA','Memphis Grizzlies','Golden State Warriors'],['Motorsports','Formula 1','Formula 1','Formula 1']];
async function tm(p){const b=TMKEY.length>60;const r=await fetch('https://api.themoviedb.org/3'+p+(b?'':(p.includes('?')?'&':'?')+'api_key='+TMKEY),b?{headers:{Authorization:'Bearer '+TMKEY}}:{});if(!r.ok)throw 0;return r.json()}
async function loadTm(){if(!TMKEY)return;try{const get=async ps=>(await Promise.allSettled(ps.map(tm))).flatMap(x=>x.status==='fulfilled'?x.value.results:[]);
 const mk=it=>{const t=it.title||it.name;if(!t||!it.poster_path)return null;REAL[t]=REAL[t]||{id:it.id,mt:it.media_type||(it.title?'movie':'tv'),p:it.poster_path,b:it.backdrop_path,r:it.vote_average||0,y:(it.release_date||it.first_air_date||'').slice(0,4),o:it.overview};return [t,hs(t)%360]};
 const ls=async ps=>{const s=new Set(),o=[];(await get(ps)).forEach(i=>{const x=mk(i);if(x&&!s.has(x[0])){s.add(x[0]);o.push(x)}});return o};
 const [h,a,ko,zh,ja,ur,ad]=await Promise.all([ls(['/trending/all/week','/movie/popular','/tv/popular']),ls(['/discover/tv?with_genres=16&with_original_language=ja']),ls(['/discover/tv?with_original_language=ko']),ls(['/discover/tv?with_original_language=zh']),ls(['/discover/tv?with_original_language=ja&with_genres=18']),ls(['/discover/tv?with_original_language=ur','/discover/tv?with_original_language=hi']),ls(['/discover/movie?with_genres=27','/discover/movie?with_genres=53','/discover/movie?with_genres=10749'])]);
 const set=(k,v)=>{if(v.length>=6)L[k]=v};set('home',h);set('anime',a);set('K-Drama',ko);set('C-Drama',zh);set('J-Drama',ja);set('Pakistani Drama',ur);set('adult',ad);render(true)}catch(e){}}
const rating=t=>REAL[t]?REAL[t].r.toFixed(1):(5+(hs(t)%45)/10).toFixed(1);
const bg=(t,w)=>REAL[t]?`;background-image:url(https://image.tmdb.org/t/p/${w}${REAL[t].p})`:'';
/* ---- state ---- */
const S={cw:[['Silent Harbor',215,62],['Iron Orchard',20,18],['Glass Tide',240,85]],ser:{},view:'home',stack:[],opt:{drama:'K-Drama',tv:'Live TV',cat:'All'},saved:{},watch:{},pl:null,lastF:{}};
try{S.adult=JSON.parse(localStorage.getItem('cinetor-adult')||'{}')}catch(e){}S.adult=Object.assign({on:false,pin:''},S.adult);
const saveAd=()=>{try{localStorage.setItem('cinetor-adult',JSON.stringify(S.adult))}catch(e){}};
const pinH=x=>[...x].reduce((a,c)=>(a*131+c.charCodeAt(0))>>>0,17)+'';
const NAV=[['search','magnify','Search'],['home','home','Home'],['anime','star-four-points-outline','Anime'],['drama','drama-masks','Drama'],['tv','television-classic','TV'],['music','music-note','Music'],['adult','shield-lock-outline','Adult'],['library','bookmark-multiple-outline','My Library'],['settings','cog-outline','Settings']];
const pt=(t,h,x='')=>`<div class="pt" data-f data-go="info" data-t="${esc(t)}" style="--h:${h}${bg(t,'w185')}"><b class="r"><i class="mdi mdi-star"></i> ${rating(t)}</b><span>${t}</span>${x}</div>`;
const LISTS={};let LID=0;const seeTile=(id,t)=>`<div class="pt see" data-f data-do="seeall" data-lid="${id}" data-t="${esc(t)}">${I('arrow-right-circle-outline')}<b>See all</b></div>`;
const seeB=(id,t)=>`<span class="seeb" data-f data-do="seeall" data-lid="${id}" data-t="${esc(t)}">See all ${I('chevron-right')}</span>`;
const row=(t,a)=>{const id='L'+(++LID);LISTS[id]={t,a};return `<div class="row"><h3><span>${t}</span>${seeB(id,t)}</h3><div class="rail">${a.map(([n,h])=>pt(n,h)).join('')}</div></div>`};
const hero=(it,go='info')=>{const [t,h]=it,r=REAL[t];return `<div class="hero" style="--hbg:linear-gradient(160deg,hsl(${h} 55% 30%),#050505)${r&&r.b?`,url(https://image.tmdb.org/t/p/w780${r.b}) center/cover`:''}"><h1>${t}</h1><div class="meta"><span class="rt">${I('star')} ${rating(t)} TMDB</span><span>${r?r.y:'2025'}</span><span>TV-14</span><span>1080p</span></div><div class="syn">${r&&r.o?r.o:'A night-shift inspector finds a ledger that was never supposed to exist, and a town that would rather it stayed buried.'}</div><div class="btns"><span class="btn p" data-f data-go="${go}" data-t="${esc(t)}">${I('play')} Play</span><span class="btn" data-f data-do="lib" data-t="${esc(t)}">${I(S.saved[t]?'check':'plus')} My List</span></div></div>`};
const chips=(k,list,cur)=>`<div class="chips">${list.map(x=>`<span class="chip${x===cur?' on':''}" data-f data-do="opt" data-k="${k}" data-v="${x}">${x}</span>`).join('')}</div>`;
const cwRow=()=>S.cw.length?`<div class="row"><h3>Continue watching <small style="color:var(--dim);font-weight:400;font-size:14px">  Press Delete to remove the selected one</small></h3><div class="rail">${S.cw.map(([n,h,w],i)=>pt(n,h,`<div class="bar"><b style="width:${w}%"></b></div>`).replace('data-go="info"',`data-go="info" data-cw="${i}"`)).join('')}<div class="pt see" data-f data-do="cwclear">${I('delete-sweep-outline')}<b>Clear all</b></div></div></div>`:'';
function feed(key){const a=L[key]||L.home,c=S.opt.cat;return hero(a[0])+chips('cat',['All',...GEN],c)+(c==='All'?(key==='home'?cwRow():'')+row('Trending now',a.slice(1,10))+row('Top rated',a.slice(5,13))+GEN.slice(0,3).map((g,i)=>row('Top '+g,a.filter((_,j)=>(j+i)%3===0).slice(0,8))).join(''):`<div class="ttl">${c}</div><div class="grid">${a.filter((_,j)=>(j+GEN.indexOf(c))%2===0).slice(0,12).map(([n,h])=>pt(n,h)).join('')}</div>`)}
/* ---- views ---- */
const V={
 home:()=>feed('home'),anime:()=>feed('anime'),
 drama:()=>{const o=S.opt.drama;return `<div style="height:14px"></div>${chips('drama',['K-Drama','C-Drama','J-Drama','Pakistani Drama'],o)}`+feed(o)},

 <div class="pbot"><div class="row2"><div class="pb" data-f data-do="pmenu" data-m="sub">${I('subtitles-outline')}</div><div class="pb" data-f data-do="pmenu" data-m="audio">${I('waveform')}</div>${sr?`<div class="pb" data-f data-do="pmenu" data-m="eps">${I('playlist-play')}</div><div class="pb" data-f data-do="pprev">${I('skip-previous')}</div><div class="pb" data-f data-do="pnext">${I('skip-next')}</div>`:''}</div>
 <div class="seek" data-f data-do="seekbar"><b id="pbar" style="width:${p.pos/p.dur*100}%"></b></div><div class="tm"><span id="pt">${p.live?'LIVE':fmt(p.pos)}</span><span>${p.live?'':fmt(p.dur)}</span></div></div></div>${p.menu?menuHtml():''}`;
 focus($('#player [data-do="ptoggle"]'))}
function menuHtml(){const p=S.pl,m=p.menu,L2={q:[2160,1080,720,480,360].map(x=>[x+'p','q',x]),sub:['Off','English','Deutsch','Bangla','Japanese','Chinese','Hindi','Spanish'].flatMap(x=>x==='Off'?[[x,'sub',x]]:[[x,'sub',x],[x+'  (generate on device)','gen',x]]),audio:['Original','English dub','Hindi dub','Bangla dub'].map(x=>[x,'audio',x]),eps:[1,2,3,4,5,6].map(x=>['Episode '+x,'ep',x])}[m];
 return `<div class="menu">${L2.map(([l,k,v])=>`<div data-f data-do="pick" data-k="${k}" data-v="${v}"><span>${l}</span>${(p[k]==v||(k==='ep'&&p.e==v))?I('check'):''}</div>`).join('')}</div>`}
setInterval(()=>{const p=S.pl;if(!p||!p.on||p.live)return;p.pos+=1;S.watch[p.t+'|'+p.s+'|'+p.e]=p.pos/p.dur;if(p.pos>=p.dur){p.e=Math.min(6,p.e+1);p.pos=0;drawPlayer()}const b=$('#pbar');if(b){b.style.width=p.pos/p.dur*100+'%';$('#pt').textContent=fmt(p.pos)}},1000);
/* ---- input ---- */
function act(el){if(!el)return;const d=el.dataset;
 if(d.go)return go(d.go,{t:d.t,live:d.live,root:d.root,s:d.s,e:d.e});
 switch(d.do){
  case 'seeall':S.stack.push({view:S.view,root:S.root,cur:S.cur,season:S.season});S.lid=d.lid;S.view='list';render();break;
  case 'back':back();break;
  case 'cwclear':S.cw=[];render();toast('Continue watching cleared');break;
  case 'cwrm':S.cw.splice(+d.i,1);render(true);break;
  case 'person':S.stack.push({view:S.view,root:S.root,cur:S.cur,season:S.season});S.pid=d.pid;S.pname=d.t;S.view='person';loadPerson(d.pid);render();break;
  case 'opt':S.opt[d.k]=d.v;render();break;
  case 'lib':S.saved[d.t]=!S.saved[d.t];render(true);toast(S.saved[d.t]?'Added to My List':'Removed');break;
  case 'season':S.season=+d.v;render(true);break;
  case 'toast':toast(d.m);break;
  case 'adultset':S.adult.on?startPin('off'):startPin('set');break;
  case 'pinchg':startPin('chk');break;
  case 'key':pinKey(d.k);break;
  case 'pback':closePlayer();break;
  case 'ptoggle':S.pl.on=!S.pl.on;drawPlayer();break;
  case 'seek':S.pl.pos=Math.max(0,Math.min(S.pl.dur,S.pl.pos+ +d.d));drawPlayer();break;
  case 'seekbar':break;
  case 'pnext':if(S.pl.e<6)S.pl.e++;else if(S.pl.s<3){S.pl.s++;S.pl.e=1}S.pl.pos=0;drawPlayer();break;
  case 'pprev':if(S.pl.e>1)S.pl.e--;else if(S.pl.s>1){S.pl.s--;S.pl.e=6}S.pl.pos=0;drawPlayer();break;
  case 'pmenu':S.pl.menu=d.m;drawPlayer();focus($('#player .menu [data-f]'));break;
  case 'pick':{const p=S.pl;if(d.k==='gen'){p.menu=null;drawPlayer();toast('Generating '+d.v+' subtitles on this device…');setTimeout(()=>{p.sub=d.v;S.ser[p.t]={q:p.q,sub:p.sub,audio:p.audio};drawPlayer();toast(d.v+' subtitles ready')},1600);break}if(d.k==='ep'){p.e=+d.v;p.pos=0}else p[d.k]=isNaN(+d.v)?d.v:+d.v;p.menu=null;S.ser[p.t]={q:p.q,sub:p.sub,audio:p.audio};drawPlayer();toast(d.k==='ep'?'Episode '+d.v:'Settings apply to the whole series');break}}
}
const KC={4:'Escape',8:'Backspace',27:'Escape',461:'Escape',10009:'Escape',23:'Enter',13:'Enter',66:'Enter',19:'ArrowUp',20:'ArrowDown',21:'ArrowLeft',22:'ArrowRight',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',85:'MediaPlayPause',179:'MediaPlayPause',415:'MediaPlayPause',89:'MediaRewind',412:'MediaRewind',90:'MediaFastForward',417:'MediaFastForward'};
function normKey(e){if(/^(GoBack|BrowserBack|XF86Back|Back)$/.test(e.key))return'Escape';if(e.key==='MediaTrackPrevious')return'MediaRewind';if(e.key==='MediaTrackNext')return'MediaFastForward';if(e.key==='Unidentified'||!e.key||e.key==='Dead')return KC[e.keyCode]||e.key;return KC[e.keyCode]&&e.key.length>1&&!/^Arrow|Enter|Escape|Backspace|Media/.test(e.key)?KC[e.keyCode]:e.key}
addEventListener('keydown',e=>{const k=normKey(e);if((k==='Delete'||k==='x')&&S.view==='home'){const f=$('.f');if(f&&f.dataset.cw!==undefined){S.cw.splice(+f.dataset.cw,1);render(true);toast('Removed from Continue watching');return}}
 if(S.view==='player'){hideT();const f=$('.f');
  if(S.pl.menu&&k==='Escape'||S.pl.menu&&k==='Backspace'){S.pl.menu=null;drawPlayer();e.preventDefault();return}
  if(f&&f.dataset.do==='seekbar'&&(k==='ArrowLeft'||k==='ArrowRight')){S.pl.pos=Math.max(0,Math.min(S.pl.dur,S.pl.pos+(k==='ArrowLeft'?-10:10)));drawPlayer();focus($('#player .seek'));e.preventDefault();return}
  if(k==='MediaPlayPause'||k===' '&&!f){S.pl.on=!S.pl.on;drawPlayer();return}
  if(k==='MediaRewind'||k==='MediaFastForward'){S.pl.pos=Math.max(0,Math.min(S.pl.dur,S.pl.pos+(k==='MediaRewind'?-10:10)));drawPlayer();return}}
 const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[k];
 if(m){e.preventDefault();move(m)}
 else if(k==='Enter'||k===' '){e.preventDefault();act($('.f'))}
 else if(k==='Escape'||k==='Backspace'||k==='BrowserBack'){e.preventDefault();back()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t){focus(t);act(t)}});
document.addEventListener('mousemove',()=>{if(S.view==='player')hideT()});
/* ---- boot with splash ---- */
render();loadTm();
const sp=document.createElement('div');sp.id='splash';sp.innerHTML=`<div>${SVGMARK}<h1><b>CINE</b>TOR</h1><small>Developed by Mythbrix</small></div>`;$('#tv').appendChild(sp);setTimeout(()=>sp.remove(),1400);
