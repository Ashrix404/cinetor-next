<script>
const {useState,useEffect,useRef,useMemo,useCallback,createContext,useContext}=React;const html=htm.bind(React.createElement);
const hs=t=>[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const IMG=(p,w)=>p?'https://image.tmdb.org/t/p/'+w+p:'';
/* ---------- TMDB ---------- */
const KEY=window.CINETOR_TMDB||'';const REAL={};
async function tm(p){const b=KEY.length>60;const r=await fetch('https://api.themoviedb.org/3'+p+(b?'':(p.includes('?')?'&':'?')+'api_key='+KEY),b?{headers:{Authorization:'Bearer '+KEY}}:{});if(!r.ok)throw new Error(r.status);return r.json()}
const W1=['Silent','Crimson','Hollow','Golden','Midnight','Iron','Glass','Paper','Salt','Ember'],W2=['Harbor','Orchard','Gate','Ledger','Court','Tide','Lantern','Station','Meridian','Garden'];
const gen=(sd,n)=>Array.from({length:n},(_,i)=>{const t=W1[(i+sd)%10]+' '+W2[(i*3+sd)%10];return mk({title:t,id:-(i+1+sd*100),media_type:'tv',vote_average:5+(hs(t)%45)/10,overview:'Placeholder title shown when no TMDB key is configured.'})});
function mk(it){const t=it.title||it.name;const o={t,id:it.id,mt:it.media_type||(it.title?'movie':'tv'),p:it.poster_path,b:it.backdrop_path,r:it.vote_average||0,y:(it.release_date||it.first_air_date||'').slice(0,4),o:it.overview||'',g:it.genre_ids||[]};REAL[t]=REAL[t]||o;return REAL[t]}
const uniq=a=>{const s=new Set();return a.filter(x=>x&&x.p&&!s.has(x.t)&&s.add(x.t))};
let DATA=null,DP=null;
function loadData(){if(DP)return DP;DP=(async()=>{if(!KEY)return DATA={home:gen(0,30),anime:gen(3,24),drama:{'K-Drama':gen(5,20),'C-Drama':gen(7,20),'J-Drama':gen(9,20),'Pakistani Drama':gen(1,20)},comics:{Manga:gen(2,20),Manhwa:gen(4,20),Manhua:gen(6,20)},adult:gen(8,16),genres:{}};
 const get=async ps=>(await Promise.allSettled(ps.map(tm))).flatMap(x=>x.status==='fulfilled'?x.value.results.map(mk):[]);const pg=(b,n)=>Array.from({length:n},(_,i)=>b+(b.includes('?')?'&':'?')+'page='+(i+1));
 let gm={};try{for(const k of['movie','tv'])(await tm('/genre/'+k+'/list')).genres.forEach(g=>gm[g.id]=g.name)}catch(e){}
 const [home,anime,ko,zh,ja,ur,ad]=await Promise.all([get([...pg('/trending/all/week',2),...pg('/movie/popular',3),...pg('/tv/popular',3)]),get([...pg('/discover/tv?with_genres=16&with_original_language=ja',3),...pg('/discover/movie?with_genres=16&with_original_language=ja',2)]),get(pg('/discover/tv?with_original_language=ko',3)),get(pg('/discover/tv?with_original_language=zh',3)),get(pg('/discover/tv?with_original_language=ja&with_genres=18',3)),get([...pg('/discover/tv?with_original_language=ur',2),...pg('/discover/tv?with_original_language=hi',2)]),get([...pg('/discover/movie?with_genres=27',2),...pg('/discover/movie?with_genres=53',2),...pg('/discover/movie?with_genres=10749',2)])]);
 return DATA={home:uniq(home),anime:uniq(anime),drama:{'K-Drama':uniq(ko),'C-Drama':uniq(zh),'J-Drama':uniq(ja),'Pakistani Drama':uniq(ur)},comics:{Manga:uniq(anime).slice(0,24),Manhwa:uniq(ko).slice(0,24),Manhua:uniq(zh).slice(0,24)},adult:uniq(ad),genres:gm}})();return DP}
/* ---------- app context ---------- */
const Ctx=createContext();
const useLS=(k,i)=>{const [v,s]=useState(()=>{try{const x=localStorage.getItem(k);return x==null?i:JSON.parse(x)}catch(e){return i}});useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},[k,v]);return [v,s]};
const pinH=x=>[...x].reduce((a,c)=>(a*131+c.charCodeAt(0))>>>0,17)+'';

/* ---------- download engine: real folder writing (File System Access), 16/32/64 connections ---------- */
let DIR=null;

function makePdf(title,pages){const e2=x=>x.replace(/[()\\]/g,'');const objs=[];const add=x=>{objs.push(x);return objs.length};add('<< /Type /Catalog /Pages 2 0 R >>');add('');const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');const kids=[];
 for(let i=1;i<=pages;i++){const t=`BT /F1 24 Tf 60 740 Td (${e2(title)}) Tj ET BT /F1 14 Tf 60 700 Td (Page ${i} of ${pages}) Tj ET BT /F1 11 Tf 60 670 Td (Generated by Cinetor prototype) Tj ET`;const c=add(`<< /Length ${t.length} >>\nstream\n${t}\nendstream`);kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents ${c} 0 R /Resources << /Font << /F1 ${font} 0 R >> >> >>`)+' 0 R')}
 objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages} >>`;let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=out.length;
 out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
const dlFile=(k,d)=>{const [t,s,e]=k.split('|');return d.kind==='comic'?{dir:'Comics',name:`${t} - Chapter ${214-(+e-1)}.pdf`}:d.kind==='music'?{dir:'Music',name:`${t}.mp3`}:{dir:'',name:`${slug(t)}.S${s}E${e}.${d.q||1080}p.mp4`}};
async function writeOut(k,d){const f=dlFile(k,d);let blob=d.kind==='comic'?makePdf(k.split('|')[0],12):new Blob(['Cinetor prototype placeholder for '+f.name],{type:'application/octet-stream'});
 if(DIR){try{let h=DIR;if(f.dir)h=await DIR.getDirectoryHandle(f.dir,{create:true});const fh=await h.getFileHandle(f.name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return 'saved'}catch(e){return 'error'}}
 if(d.kind==='comic'){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return 'download'}return 'none'}
const dlSpeed=(d,conn)=>(d.sp*Math.pow(conn/16,.62)*3).toFixed(1);
const GENRES=['Action','Adventure','Animation','Comedy','Crime','Documentary','Drama','Family','Fantasy','Horror','Mystery','Romance','Sci-Fi','Thriller'];

function Player({st,close,setSt}){const c=useContext(Ctx);const [hide,setHide]=useState(false);const [menu,setMenu]=useState(null);const [gen,setGen]=useState('');const tmr=useRef();

 useEffect(()=>{const t=setInterval(()=>{const d=dlRef.current,n={};let ch=false;Object.keys(d).forEach(k=>{const x=d[k];if(x.p<100&&!x.paused){ch=true;const f=Math.pow(dsetRef.current.conn/16,.62);const p=Math.min(100,x.p+x.sp*f*(x.kind==='comic'?1.8:1));n[k]={...x,p};if(p>=100)writeOut(k,x).then(r=>{setTt(r==='saved'?'Saved to the chosen folder: '+dlFile(k,x).name:r==='download'?'PDF downloaded: '+dlFile(k,x).name:r==='error'?'Could not write the file':'Finished: '+dlFile(k,x).name);setTimeout(()=>setTt(''),2400)})}else n[k]=x});if(ch)setDl(n)},600);return()=>clearInterval(t)},[]);
