<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;height:100%;background:#000}iframe{width:100%;height:460px;border:0}</style>
<iframe id="f" allowfullscreen allow="autoplay *; encrypted-media *; fullscreen *; picture-in-picture *" referrerpolicy="origin"></iframe>
<script>
// ?u=<embed url>  &sandbox=<tokens>: same sandbox the web app puts on servers marked sandbox-safe (src/core/embeds.ts)
var q = new URLSearchParams(location.search), f = document.getElementById('f');
window.__msgs = [];
addEventListener('message', function (e) { if (e.data && e.data.__cinetor === 'embed') window.__msgs.push(e.data.ev + '@' + e.data.host); });
if (q.get('sandbox')) f.setAttribute('sandbox', q.get('sandbox'));
f.src = q.get('u');
</script>
